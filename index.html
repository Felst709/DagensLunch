<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DagensLunch.se</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        #map { height: 250px; width: 100%; z-index: 1; border-radius: 1rem; }
        .ad-space { width: 160px; height: 600px; background-color: #e5e7eb; display: flex; align-items: center; justify-content: center; color: #9ca3af; font-size: 0.8rem; border-radius: 0.5rem; }
    </style>
</head>
<body class="text-gray-800 flex flex-col min-h-screen">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-orange-100 p-2 rounded-full">
                    <i class="fa-solid fa-utensils text-orange-500 text-lg"></i>
                </div>
                <h1 class="text-lg font-bold tracking-tight">DagensLunch<span class="text-orange-500">.se</span></h1>
            </div>
            <div class="text-right">
                <div class="text-xs font-bold text-orange-500 uppercase tracking-wide" id="week-display">VECKA --</div>
                <div class="text-sm font-medium text-gray-600 capitalize" id="header-date">Laddar...</div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="flex justify-center gap-6 py-8 px-4">
        <!-- Vänster Annonsplats -->
        <aside class="hidden xl:block w-[160px] flex-shrink-0 sticky top-24 h-screen"><div class="ad-space mb-4">Annons</div></aside>

        <div class="w-full max-w-5xl">
            <!-- Rubrik & Sök -->
            <div class="text-center mb-8">
                <h2 class="text-3xl font-extrabold text-gray-900">Dagens Lunch</h2>
                <p class="text-gray-500 text-sm mt-1">Hitta din favorit i lunchdjungeln</p>
            </div>

            <div class="flex flex-col md:flex-row gap-3 mb-8">
                <div class="relative md:w-56">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-city text-gray-400"></i>
                    </div>
                    <select id="citySelector" class="appearance-none w-full bg-white border border-gray-200 text-gray-700 py-3 pl-10 pr-8 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500 font-semibold cursor-pointer shadow-sm hover:border-gray-300 transition">
                        <option value="Norrköping">Norrköping</option>
                        <option value="Linköping">Linköping</option>
                    </select>
                    <div class="absolute inset-y-0 right-0 flex items-center px-2 pointer-events-none">
                        <i class="fa-solid fa-chevron-down text-xs text-gray-400"></i>
                    </div>
                </div>

                <div class="relative flex-grow">
                    <input type="text" id="searchInput" placeholder="Sök maträtt, restaurang eller kategori..." class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-orange-500 shadow-sm text-gray-700">
                    <i class="fa-solid fa-search absolute left-4 top-3.5 text-gray-400"></i>
                </div>
            </div>

            <!-- Grid: Top 4 -->
            <div id="restaurant-grid-top" class="grid grid-cols-1 lg:grid-cols-2 gap-5 mb-8"></div>

            <!-- Karta -->
            <div class="mb-8 shadow-lg rounded-2xl border border-gray-200 p-1 bg-white relative group">
                <div class="absolute top-2 left-2 z-[400] bg-white/90 backdrop-blur px-3 py-1 rounded-md text-xs font-bold shadow text-gray-700 pointer-events-none">
                    <i class="fa-solid fa-map-pin text-orange-500 mr-1"></i> Karta
                </div>
                <div id="map"></div>
            </div>

            <!-- Grid: Bottom -->
            <div id="restaurant-grid-bottom" class="grid grid-cols-1 lg:grid-cols-2 gap-5"></div>
        </div>

        <!-- Höger Annonsplats -->
        <aside class="hidden xl:block w-[160px] flex-shrink-0 sticky top-24 h-screen"><div class="ad-space mb-4">Annons</div></aside>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-12 mt-auto text-center">
        <div class="container mx-auto px-4">
            <div class="mb-8">
                <a href="https://instagram.com/dagenslunch.se" target="_blank" class="inline-flex items-center gap-2 text-pink-600 hover:text-pink-800 transition text-lg font-bold">
                    <i class="fa-brands fa-instagram text-2xl"></i> Följ oss på Instagram
                </a>
            </div>
            <div class="bg-gray-50 rounded-2xl p-6 max-w-lg mx-auto mb-10 border border-gray-100">
                <p class="text-xs text-gray-400 uppercase tracking-widest font-bold mb-2">För Restauranger</p>
                <h4 class="text-gray-800 font-bold mb-1">Vill du synas här?</h4>
                <p class="text-gray-500 text-sm mb-4">Vi hjälper dig att nå ut.</p>
                <a href="mailto:info@dagenslunch.se" class="inline-flex items-center gap-2 text-orange-600 bg-white border border-gray-200 hover:bg-orange-50 px-5 py-2.5 rounded-full text-sm font-bold transition shadow-sm">
                    <i class="fa-regular fa-envelope"></i> Kontakta oss
                </a>
            </div>
            <p class="text-gray-400 text-xs">&copy; 2026 DagensLunch.se</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script>
        let allRestaurants = [];
        let map = null;

        const cityCenters = {
            "Norrköping": { lat: 58.5877, lon: 16.1924 },
            "Linköping": { lat: 58.4108, lon: 15.6214 }
        };

        async function loadLunchData() {
            try {
                const response = await fetch('lunch_data.json');
                allRestaurants = await response.json();
                updateCity();
            } catch (error) {
                console.error("Fel:", error);
            }
        }

        function updateCity() {
            const city = document.getElementById('citySelector').value;
            const search = document.getElementById('searchInput').value;
            filterAndRender(city, search);
            initMap(city, search);
        }

        document.getElementById('citySelector').addEventListener('change', updateCity);
        document.getElementById('searchInput').addEventListener('keyup', updateCity);

        function filterAndRender(city, searchString) {
            const searchLower = searchString.toLowerCase();
            const filtered = allRestaurants.filter(place => {
                if (place.city !== city) return false;
                if (!searchString) return true;
                
                const nameMatch = place.name.toLowerCase().includes(searchLower);
                const dishMatch = place.menu && place.menu.some(dish => dish.toLowerCase().includes(searchLower));
                
                let rawCat = place.category || [];
                let catArray = Array.isArray(rawCat) ? rawCat : [rawCat];
                const catMatch = catArray.some(c => c.toLowerCase().includes(searchLower));
                
                return nameMatch || dishMatch || catMatch;
            });
            renderRestaurants(filtered, city);
        }

        function renderRestaurants(items, city) {
            const gridTop = document.getElementById('restaurant-grid-top');
            const gridBottom = document.getElementById('restaurant-grid-bottom');
            gridTop.innerHTML = ''; gridBottom.innerHTML = '';

            if (items.length === 0) {
                gridTop.innerHTML = `<div class="col-span-full text-center py-10 bg-white rounded-2xl border border-gray-100"><p class="text-gray-400 italic">Inga restauranger hittades.</p></div>`;
                return;
            }

            items.forEach((place, index) => {
                // Säkerställ att kategorier alltid är en array
                let rawCat = place.category || "Mat";
                let catArray = Array.isArray(rawCat) ? rawCat : [rawCat];
                
                let categoriesHtml = catArray.map(cat => 
                    `<span class="inline-block bg-orange-50 text-orange-700 text-[9px] font-bold px-2 py-0.5 rounded-full border border-orange-100">${cat}</span>`
                ).join('');

                // Menylista med line-clamp så texten aldrig bryter layouten
                let menuHtml = '';
                if (place.menu && place.menu.length > 0) {
                    menuHtml = place.menu.map(dish => `<li class="mb-1 text-gray-600 text-[11px] leading-tight line-clamp-1 pr-2" title="${dish}"><span class="text-orange-400 mr-1 text-[8px]">●</span> ${dish}</li>`).join('');
                } else {
                    menuHtml = `<li class="text-gray-400 italic text-[11px] pl-1 mt-1">Se meny på hemsidan</li>`;
                }

                // Snygga till pristryck (Byter ut ":- - :-" mot rent "kr")
                let formattedPrice = place.price || '';
                formattedPrice = formattedPrice.replace(/:-\s*-\s*/g, ' – ').replace(/:-/g, ' kr');

                const card = `
                    <div class="bg-white rounded-xl border border-gray-100 shadow-sm hover:shadow-xl transition-shadow duration-300 flex flex-row h-[200px] overflow-hidden relative group">
                        
                        <!-- BILD & BETYG -->
                        <div class="w-1/3 relative overflow-hidden flex-shrink-0 bg-gray-100">
                            <img src="${place.image || 'https://images.unsplash.com/photo-1559339352-11d035aa65de'}" class="w-full h-full object-cover group-hover:scale-105 transition duration-700">
                            
                            <!-- BETYG (Större och mer i fokus) -->
                            <div class="absolute top-3 left-3 bg-white/95 backdrop-blur-sm px-2.5 py-1 rounded-lg text-sm font-extrabold text-gray-900 shadow-md flex items-center gap-1.5 border border-white/20">
                                <i class="fa-solid fa-star text-yellow-400 text-xs"></i> 
                                ${place.rating || '4.0'}
                            </div>
                        </div>
                        
                        <!-- INFORMATION -->
                        <div class="w-2/3 p-4 flex flex-col justify-between overflow-hidden bg-white">
                            <div class="overflow-hidden flex flex-col h-full">
                                
                                <div class="flex justify-between items-start mb-1 flex-shrink-0">
                                    <h3 class="text-base font-extrabold text-gray-900 truncate" title="${place.name}">${place.name}</h3>
                                    
                                    <!-- INSTAGRAM (Tillbaka till rosa, och lite större: text-2xl) -->
                                    <a href="${place.instagram_url}" target="_blank" class="text-pink-600 hover:text-pink-700 hover:scale-110 transition-transform ml-2 flex-shrink-0">
                                        <i class="fa-brands fa-instagram text-2xl"></i>
                                    </a>
                                </div>
                                
                                <div class="mb-2 flex flex-wrap gap-1 max-h-12 overflow-hidden flex-shrink-0 mt-0.5">
                                    ${categoriesHtml}
                                </div>
                                
                                <ul class="overflow-hidden flex-grow mt-1.5">${menuHtml}</ul>
                            </div>

                            <!-- PRIS & KNAPP -->
                            <div class="flex justify-between items-end pt-3 border-t border-gray-100 mt-2 flex-shrink-0">
                                <div class="flex flex-col">
                                    <span class="text-[9px] text-gray-400 font-bold uppercase tracking-widest mb-0.5">Pris</span>
                                    <span class="text-sm font-black text-gray-800 tracking-tight">${formattedPrice}</span>
                                </div>
                                <a href="${place.url}" target="_blank" class="text-[11px] font-bold text-white bg-gray-900 px-4 py-2 rounded-lg hover:bg-orange-500 transition-colors shadow-sm">
                                    Se meny
                                </a>
                            </div>
                        </div>
                    </div>
                `;
                
                if (index < 4) gridTop.innerHTML += card;
                else gridBottom.innerHTML += card;
            });
        }

        function initMap(city, searchString = "") {
            const center = cityCenters[city];
            if (map) { map.remove(); map = null; }
            map = L.map('map', { scrollWheelZoom: false }).setView([center.lat, center.lon], 13);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);
            
            const searchLower = searchString.toLowerCase();
            allRestaurants.filter(place => {
                if (place.city !== city) return false;
                if (!searchString) return true;
                
                const nameMatch = place.name.toLowerCase().includes(searchLower);
                const dishMatch = place.menu && place.menu.some(dish => dish.toLowerCase().includes(searchLower));
                
                let rawCat = place.category || [];
                let catArray = Array.isArray(rawCat) ? rawCat : [rawCat];
                const catMatch = catArray.some(c => c.toLowerCase().includes(searchLower));
                
                return nameMatch || dishMatch || catMatch;
            }).forEach(place => {
                L.marker([place.lat, place.lon]).bindPopup(`<div class="text-center"><b class="text-sm">${place.name}</b></div>`).addTo(map);
            });
        }

        // Datum och vecka i headern
        const today = new Date();
        document.getElementById('header-date').innerText = today.toLocaleDateString('sv-SE', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }).toUpperCase();
        
        const d = new Date(Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()));
        d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
        const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
        document.getElementById('week-display').innerText = "VECKA " + Math.ceil((((d - yearStart) / 86400000) + 1)/7);

        // Starta allt
        loadLunchData();
    </script>
</body>
</html>
