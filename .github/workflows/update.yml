name: Hämta Luncher

on:
  schedule:
    # Körs klockan 06:00 UTC varje morgon (kl 07:00 / 08:00 svensk tid)
    - cron: '0 6 * * *'
  # Gör att du kan starta den manuellt för att testa direkt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta din kod
        uses: actions/checkout@v4

      - name: Installera Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Installera verktyg (requests & bs4)
        run: pip install requests beautifulsoup4

      - name: Kör roboten
        run: python scraper.py

      - name: Spara den nya menyn
        run: |
          git config --global user.name "Lunch-Robot"
          git config --global user.email "robot@lunchkollen.se"
          git add lunch_data.json
          git commit -m "Uppdaterade dagens maträtter" || exit 0
          git push
